<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Cache MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside class="conversation-sidebar" aria-label="conversation list">
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">cached chats</p>
            <h2>Conversations</h2>
          </div>
          <button id="sidebarRefreshButton" class="icon-button" type="button" title="Refresh conversations">Refresh</button>
        </div>
        <button id="newConversationButton" class="new-chat-button" type="button">New chat</button>
        <ul id="conversationList" class="conversation-list"></ul>
      </aside>

      <main class="app">
      <header class="topbar">
        <div>
          <h1>Mobile Cache MVP</h1>
          <p id="providerLine">Supabase Edge Function</p>
        </div>
        <div class="top-actions">
          <button id="sidebarToggleButton" class="icon-button" type="button" title="Toggle conversations" aria-expanded="true">Hide chats</button>
          <button id="exportButton" class="icon-button" type="button" title="Export">Export</button>
          <button id="resetButton" class="icon-button" type="button" title="Reset">Reset</button>
        </div>
      </header>

      <section class="config-panel">
        <details open>
          <summary>service provider</summary>
          <form id="profileForm" class="profile-form">
            <label>
              <span>Supabase URL</span>
              <input id="supabaseUrlInput" type="url" autocomplete="off" placeholder="https://project-ref.supabase.co" />
            </label>
            <label>
              <span>Supabase anon key</span>
              <input id="supabaseAnonKeyInput" type="password" autocomplete="off" placeholder="Leave empty to keep existing key" />
            </label>
            <label>
              <span>Supabase user JWT</span>
              <input id="supabaseJwtInput" type="password" autocomplete="off" placeholder="Optional, leave empty to keep existing JWT" />
            </label>
            <div class="auth-login">
              <label>
                <span>Supabase email</span>
                <input id="supabaseEmailInput" type="email" autocomplete="username" placeholder="Optional login email" />
              </label>
              <label>
                <span>Supabase password</span>
                <input id="supabasePasswordInput" type="password" autocomplete="current-password" placeholder="Only used to request a JWT" />
              </label>
              <button id="supabaseLoginButton" type="button">Log in for JWT</button>
            </div>
            <label>
              <span>Model provider</span>
              <select id="modelProviderSelect" class="model-select" aria-label="Model provider">
                <option value="openai">OpenAI</option>
                <option value="grok">Grok</option>
              </select>
            </label>
            <label>
              <span>Model</span>
              <div class="model-picker">
                <input id="modelInput" type="text" autocomplete="off" list="modelList" />
                <button id="loadModelsButton" type="button">Load models</button>
              </div>
              <datalist id="modelList"></datalist>
              <select id="modelFilterSelect" class="model-select" aria-label="Model list filter">
                <option value="text">Text + fine-tuned</option>
                <option value="fine-tuned">Fine-tuned only</option>
                <option value="all">All models</option>
              </select>
              <select id="modelSelect" class="model-select" aria-label="Available models">
                <option value="">Select a loaded model</option>
              </select>
            </label>
            <label>
              <span>Vector store aliases</span>
              <input id="vectorStoreAliasesInput" type="text" autocomplete="off" placeholder="Optional, comma separated aliases" />
            </label>
            <label>
              <span>Use vector store</span>
              <select id="activeVectorStoreSelect">
                <option value="">None</option>
              </select>
            </label>
            <label>
              <span>System prompt</span>
              <textarea id="systemPromptInput" rows="4"></textarea>
            </label>
            <button id="saveProfileButton" type="submit">Save settings</button>
            <p id="profileStatus">stored in this browser</p>
          </form>
        </details>
      </section>

      <section class="conversation-head">
        <p class="eyebrow">content database</p>
        <h2 id="conversationTitle">loading</h2>
        <p id="statusLine">idle</p>
      </section>

      <section id="messageStack" class="message-stack" aria-label="messages"></section>

      <form id="runForm" class="composer">
        <textarea id="inputBox" rows="4" placeholder="Type a prompt. The reply will come from the Supabase Edge Function and be saved into the local content database."></textarea>
        <button id="runButton" type="submit">Run</button>
      </form>
      </main>
    </div>

    <dialog id="editDialog">
      <form method="dialog" class="edit-form">
        <h3>Edit prompt</h3>
        <textarea id="editPromptInput" rows="8"></textarea>
        <div class="dialog-actions">
          <button id="cancelEditButton" value="cancel" type="submit">Cancel</button>
          <button id="saveEditButton" value="default" type="button">Save version</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
